name: Release

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/HeliBorg/HeliBoard
  # how many published pre-releases to keep when pruning
  KEEP_PRERELEASES: 3

jobs:
  release:

    runs-on: ubuntu-latest

    steps:
      - name: Check signing secrets
        # before anything is built, so nothing can reach a release unsigned
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            eval "value=\${$name}"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing repository secret(s):$missing - run tools/generate-keystore.sh and set them under Settings -> Secrets and variables -> Actions"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick the channel
        run: |
          case "$GITHUB_REF_NAME" in
            main)
              echo "CHANNEL=stable" >> "$GITHUB_ENV"
              echo "VARIANT=release" >> "$GITHUB_ENV"
              echo "GRADLE_TASK=assembleRelease" >> "$GITHUB_ENV"
              ;;
            dev)
              echo "CHANNEL=beta" >> "$GITHUB_ENV"
              echo "VARIANT=beta" >> "$GITHUB_ENV"
              echo "GRADLE_TASK=assembleBeta" >> "$GITHUB_ENV"
              ;;
            *)
              echo "::error::$GITHUB_REF_NAME is not a release branch, only main and dev are"
              exit 1
              ;;
          esac

      - name: Fetch upstream and stable history
        run: |
          git remote add upstream "$UPSTREAM_URL"
          git fetch --no-tags --quiet upstream +refs/heads/main:refs/remotes/upstream/main
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          git fetch --tags --force --quiet origin

      - name: Compose the version
        run: |
          set -o pipefail
          tools/compose-version.sh "$CHANNEL" | tee -a "$GITHUB_ENV"

      - name: Write the release notes
        run: tools/release-notes.sh "$CHANNEL" > release-notes.md

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/keystore.jks" >> "$GITHUB_ENV"

      - name: Build the APK
        env:
          FORK_VERSION_NAME: ${{ env.VERSION_NAME }}
          FORK_VERSION_CODE: ${{ env.VERSION_CODE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew "$GRADLE_TASK"

      - name: Verify the signature and name the asset after the tag
        run: |
          set -o pipefail
          apk=$(find "app/build/outputs/apk/$VARIANT" -maxdepth 1 -name '*.apk')
          if [ -z "$apk" ] || [ "$(printf '%s\n' "$apk" | wc -l)" != 1 ]; then
            echo "::error::expected exactly one APK in app/build/outputs/apk/$VARIANT, found: $apk"
            exit 1
          fi
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner not found, cannot confirm the APK is signed"
            exit 1
          fi
          "$apksigner" verify --print-certs "$apk"
          mkdir -p dist
          # named after the tag, so pushing again replaces the asset instead of adding one
          cp "$apk" "dist/HeliBoard-$TAG.apk"
          echo "ASSET=dist/HeliBoard-$TAG.apk" >> "$GITHUB_ENV"

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1)
          if [ -z "$release_id" ]; then
            prerelease=
            [ "$CHANNEL" = beta ] && prerelease=--prerelease
            # a draft creates no tag, so the tag is created by whoever presses Publish
            gh release create "$TAG" --draft --title "$TAG" --target "$GITHUB_SHA" \
              --notes-file release-notes.md $prerelease
          else
            gh release edit "$TAG" --target "$GITHUB_SHA" --notes-file release-notes.md
          fi
          gh release upload "$TAG" "$ASSET" --clobber
          echo "draft $TAG updated, publish it at $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases" >> "$GITHUB_STEP_SUMMARY"

      - name: Prune old pre-releases
        # after the release step, so the release just made is part of the state this prunes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          # drafts are skipped so the open one survives, and the tags are kept so beta
          # numbering never walks backwards onto a number that was already used
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq '.[] | select(.draft == false and .prerelease == true) | [.published_at, (.id | tostring), .tag_name] | @tsv' \
            | sort -r | tail -n +$((KEEP_PRERELEASES + 1)) > to_prune.tsv
          while IFS="$(printf '\t')" read -r published id tag; do
            [ -n "$id" ] || continue
            echo "deleting pre-release $tag"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done < to_prune.tsv
